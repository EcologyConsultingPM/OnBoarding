name: Private daily database backup

on:
  workflow_dispatch:
  schedule:
    # 18:40 UTC daily. Use one scheduled run only to preserve the zero-cost budget.
    - cron: "40 18 * * *"

permissions:
  contents: read

concurrency:
  group: ecology-private-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_POOLER_DB_URL: ${{ secrets.SUPABASE_POOLER_DB_URL }}
      BACKUP_STATUS_TOKEN: ${{ secrets.BACKUP_STATUS_TOKEN }}
      BACKUP_ARCHIVE_PASSWORD: ${{ secrets.BACKUP_ARCHIVE_PASSWORD }}
      BACKUP_STATUS_URL: https://www.ecologyconsultingsaas.app/api/cron/backup-status
      # Keep the automated archive safely within a conservative zero-cost ceiling.
      MAX_ARCHIVE_BYTES: 104857600
      RETENTION_DAYS: 1
      RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Validate private backup configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_POOLER_DB_URL:-}" && -z "${SUPABASE_DB_URL:-}" ]]; then
            echo "::error::Set SUPABASE_POOLER_DB_URL to this project's Session pooler connection string."
            exit 1
          fi
          for name in BACKUP_STATUS_TOKEN BACKUP_ARCHIVE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required Actions secret $name is missing."
              exit 1
            fi
          done
          echo "BACKUP_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Check out backup collector
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Report backup start
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 --connect-timeout 15 --max-time 60 \
            -X POST "$BACKUP_STATUS_URL" \
            -H "Authorization: Bearer $BACKUP_STATUS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"run_id\":\"$RUN_ID\",\"status\":\"running\",\"started_at\":\"$BACKUP_STARTED_AT\",\"workflow_name\":\"private-daily-database-backup\",\"retention_days\":$RETENTION_DAYS,\"coverage\":{\"database_roles\":false,\"database_schema\":false,\"database_data\":false,\"storage_objects\":false}}"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Select IPv4-capable database connection
        shell: bash
        run: |
          set -euo pipefail
          # Copy the exact Session pooler URL from this project's Connect dialog.
          # Pooler cluster indexes cannot be inferred from the project's region.
          # The explicit pooler secret must override even an existing pooler URL.
          python3 - <<'PY'
          import os
          import re
          import sys
          from urllib.parse import parse_qsl, quote, unquote, urlencode, urlsplit, urlunsplit

          def fail(message):
              print(f"::error::{message}", file=sys.stderr)
              raise SystemExit(1)

          def mask(value):
              if value:
                  escaped = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::add-mask::{escaped}", flush=True)

          project_ref = "qjsdglkipgncttztksxl"
          raw = os.environ.get("SUPABASE_POOLER_DB_URL") or os.environ.get("SUPABASE_DB_URL", "")
          trimmed = raw.strip()
          if trimmed != raw:
              print("::warning::Removed leading/trailing whitespace from the configured backup database URL.", flush=True)
          raw = trimmed
          if not raw or any(ord(c) < 32 or ord(c) == 127 for c in raw):
              fail("The backup database URL is missing or contains control characters.")
          mask(raw)
          try:
              parts = urlsplit(raw)
              port = parts.port
          except ValueError:
              fail("The backup database URL is malformed. Copy the Session pooler URL from Supabase Connect.")
          if parts.scheme not in {"postgres", "postgresql"} or not parts.hostname:
              fail("The backup database URL must be a PostgreSQL connection string.")
          if not re.fullmatch(r"aws-\d+-[a-z0-9-]+\.pooler\.supabase\.com", parts.hostname):
              fail("Set SUPABASE_POOLER_DB_URL to the exact IPv4 Session pooler URL from Supabase Connect; a direct URL cannot safely determine the pooler host.")
          if unquote(parts.username or "") != f"postgres.{project_ref}":
              fail("The Session pooler URL must use this project's project-qualified username: postgres.qjsdglkipgncttztksxl.")
          if port not in {5432, 6543}:
              fail("The shared pooler URL must use port 5432 (Session) or 6543 (Transaction).")
          if parts.path != "/postgres" or parts.fragment or (parts.password and any(c.isspace() for c in parts.password)):
              fail("The backup URL must target /postgres and reserved password characters must be percent-encoded.")
          password = unquote(parts.password or "")
          if not password or "[YOUR-PASSWORD]" in password or any(ord(c) < 32 or ord(c) == 127 for c in password):
              fail("The backup database URL needs the current database password, not a placeholder or an API key.")
          mask(parts.password)
          mask(password)
          encoded_password = quote(password, safe="")
          mask(encoded_password)
          try:
              query = dict(parse_qsl(parts.query, strict_parsing=True))
          except ValueError:
              fail("The backup URL has malformed query parameters. Percent-encode reserved password characters.")
          sslmode = query.get("sslmode", "require")
          if sslmode not in {"require", "verify-ca", "verify-full"}:
              fail("The backup connection must require TLS (sslmode=require or stricter).")
          query["sslmode"] = sslmode
          query["connect_timeout"] = "20"
          # Backups use a single session, not transaction pooling. The host and
          # credentials remain exactly those configured by the project owner.
          selected = urlunsplit((parts.scheme, f"postgres.{project_ref}:{encoded_password}@{parts.hostname}:5432", "/postgres", urlencode(query), ""))
          mask(selected)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"SUPABASE_DB_URL={selected}\n")
          print("Using the configured IPv4 Supabase Session pooler on port 5432 with TLS required.")
          PY

      - name: Create private logical database archive
        id: dump
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p backup
          # Clean all partial plaintext, including private photos, on every exit.
          trap 'rm -f backup/roles.sql backup/schema.sql backup/data.sql backup/database.tar.gz; rm -rf backup/storage_objects; rm -f backup/storage_manifest.json' EXIT
          supabase db dump --remote="$SUPABASE_DB_URL" --role-only -f backup/roles.sql
          supabase db dump --remote="$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --remote="$SUPABASE_DB_URL" --data-only --use-copy -x storage.buckets_vectors -x storage.vector_indexes -f backup/data.sql
          test -s backup/roles.sql && test -s backup/schema.sql && test -s backup/data.sql
          # Reuses BACKUP_STATUS_TOKEN and derives the private storage endpoint
          # from BACKUP_STATUS_URL; no service key or additional secret in Actions.
          python3 scripts/backup_storage_objects.py --directory backup
          python3 scripts/backup_storage_objects.py --directory backup --verify
          tar -czf backup/database.tar.gz -C backup roles.sql schema.sql data.sql storage_objects storage_manifest.json
          openssl enc -aes-256-cbc -pbkdf2 -salt -in backup/database.tar.gz -out backup/ecology-database.tar.gz.enc -pass env:BACKUP_ARCHIVE_PASSWORD
          bytes=$(stat -c%s backup/ecology-database.tar.gz.enc)
          if [ "$bytes" -gt "$MAX_ARCHIVE_BYTES" ]; then
            echo "Encrypted archive ($bytes bytes) exceeds the configured zero-cost ceiling ($MAX_ARCHIVE_BYTES bytes)." >&2
            exit 1
          fi
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum backup/ecology-database.tar.gz.enc | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "storage_objects=true" >> "$GITHUB_OUTPUT"

      - name: Retain encrypted private archive
        uses: actions/upload-artifact@v4
        with:
          name: ecology-private-database-${{ github.run_id }}
          path: backup/ecology-database.tar.gz.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Report backup outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ job.status }}" = "success" ] && [ "${{ steps.dump.outputs.storage_objects }}" = "true" ]; then
            payload="{\"run_id\":\"$RUN_ID\",\"status\":\"succeeded\",\"started_at\":\"$BACKUP_STARTED_AT\",\"workflow_name\":\"private-daily-database-backup\",\"archive_bytes\":${{ steps.dump.outputs.bytes }},\"archive_sha256\":\"${{ steps.dump.outputs.sha256 }}\",\"retention_days\":$RETENTION_DAYS,\"coverage\":{\"database_roles\":true,\"database_schema\":true,\"database_data\":true,\"storage_objects\":true}}"
          else
            started_at="${BACKUP_STARTED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
            payload="{\"run_id\":\"$RUN_ID\",\"status\":\"failed\",\"started_at\":\"$started_at\",\"workflow_name\":\"private-daily-database-backup\",\"retention_days\":$RETENTION_DAYS,\"error_summary\":\"No verified database and storage archive was retained. Inspect the failed GitHub Actions step for database or photo backup configuration, download, verification, or shared size/count/time ceiling failure.\",\"coverage\":{\"database_roles\":false,\"database_schema\":false,\"database_data\":false,\"storage_objects\":false}}"
          fi
          if [[ -z "${BACKUP_STATUS_TOKEN:-}" ]]; then
            echo "::error::Cannot report outcome: BACKUP_STATUS_TOKEN is missing."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 2 --connect-timeout 15 --max-time 60 \
            -X POST "$BACKUP_STATUS_URL" \
            -H "Authorization: Bearer $BACKUP_STATUS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload"
